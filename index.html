<script>
const $ = s => document.querySelector(s);
let cfg = {}, history = [], tok = null, tokExp = 0, speak = false;
const SCOPES = ["calendar", "classroom.courses.readonly", "classroom.coursework.me.readonly"]
  .map(s => "https://www.googleapis.com/auth/" + s).join(" ");
const DB = () => ({ eventos: [], notas: [], css: "", inv: [], perfil: {}, sim: { cash: 10000, pos: {} }, ...JSON.parse(localStorage.getItem("jared_data") || "{}") });
const saveDB = d => localStorage.setItem("jared_data", JSON.stringify(d));
const applyCss = () => { $("#usercss").textContent = DB().css; };
const SYSTEM = () => `Eres J.A.R.E.D., un asistente personal al estilo de JARVIS. Llama SIEMPRE "señor" al usuario. Tono elegante, ingenioso y conciso. Responde en español.
Herramientas: agenda_add / agenda_list / agenda_remove para los eventos del usuario (anótalos en cuanto los mencione; convierte fechas relativas a YYYY-MM-DD con la fecha actual; tipo "examen" para exámenes); cambiar_estilo para rediseñar la interfaz con CSS (variables disponibles en :root: --bg, --panel, --line, --cy, --tx, --mut; también puedes usar selectores como body, .m, .u, .a, header, #log) y restablecer_estilo para volver al diseño original; recordar para guardar datos o gustos del usuario; donde_ver para películas y series (no puedes reproducirlas: abre un buscador de plataformas legales); investigar / investigaciones_estado / investigacion_detener / investigacion_resultados para vigilar un tema durante horas buscando en internet cada cierto tiempo (solo funciona mientras esta pestaña siga abierta; si no dan tema, horas o frecuencia, pregúntalo); crear_imagen para generar una imagen a partir de una descripción; clima para el tiempo de una ciudad (cambia el aspecto de la interfaz según el estado; si no indican ciudad, pregúntala); calendar_* y classroom_tareas solo si el usuario ha conectado Google.
Fecha y hora actual: ${new Date().toString()}.
Perfil del usuario: nombre «${DB().perfil?.nombre || "sin indicar"}»; sobre él: ${DB().perfil?.sobre || "nada"}.
Lo que sabes del usuario: ${DB().notas.join("; ") || "nada todavía"}.`;
function morning0() {
  const hoy = new Date(new Date().setHours(0, 0, 0, 0)), hr = new Date().getHours();
  const ev = DB().eventos.map(e => { const [y, m, d] = e.fecha.split("-").map(Number); return { ...e, dias: Math.round((new Date(y, m - 1, d) - hoy) / 864e5) }; })
    .filter(e => e.dias >= 0 && e.dias <= 7).sort((a, b) => a.dias - b.dias);
  const saludo = hr < 13 ? "Buenos días" : hr < 21 ? "Buenas tardes" : "Buenas noches";
  if (!ev.length) return saludo + ", señor. No tiene nada anotado para los próximos 7 días. Dígame sus eventos y los apunto.";
  return saludo + ", señor. Su agenda:\n" + ev.map(e => {
    const cuando = e.dias === 0 ? "Hoy" : e.dias === 1 ? "Mañana" : `En ${e.dias} días (${e.fecha})`;
    const aviso = e.dias <= 4 && /examen|prueba|entrega/i.test(e.tipo + " " + e.titulo) ? ` ⚠ quedan ${e.dias === 0 ? "0 días: es hoy" : e.dias + " días"}` : "";
    return `• ${cuando}: ${e.titulo}${aviso}`;
  }).join("\n");

let aCtx = null, aStream = null, aRaf = 0, nivelS = 1;
